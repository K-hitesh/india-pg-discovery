name: India PG Discovery

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * 1"

permissions:
  contents: write

concurrency:
  group: pg-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run PG discovery
        env:
          PG_USER_AGENT: "IndiaPGDiscovery/1.0 (contact: YOUR_EMAIL@example.com)"
        run: python src/pg_scraper.py

      - name: Upload collected data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pg-discovery-results
          path: |
            data/pgs.csv
            data/pgs.sqlite
          if-no-files-found: warn
          retention-days: 14
